name: Foreign installation client trial
on:
  push:
    branches: [trial/unified-smite-install]
  pull_request:
    paths:
      - modules/smite-foreign-install-client.py
      - modules/smite-unified-foreign-identity-phase.py
      - tests/test-smite-unified-foreign-identity-phase.py
      - tests/test-smite-foreign-install-client.py
      - modules/smite-unified-trial-pair-admission.py
      - modules/smite-unified-panel-stage.py
      - modules/smite-install.sh
      - tests/test-smite-unified-foreign-after-core.sh
      - modules/smite-foreign-gateway.sh
      - modules/smite-unified-foreign-gateway-plan.py
      - tests/test-smite-unified-foreign-gateway-plan.py
      - tests/test-smite-unified-gateway-menu-boundary.sh
      - modules/docker-3xui.sh
      - tests/test-smite-unified-sanaei-continuation.sh
      - modules/smite-unified-panel-transaction.py
      - tests/test-smite-unified-panel-transaction.py
      - tests/test-smite-unified-panel-stage.py
      - tests/test-smite-unified-trial-pair-admission.py
      - modules/smite-foreign-install-promotion.py
      - modules/smite-foreign-install-panel-ingress.py
      - tests/test-smite-foreign-install-panel-ingress.py
      - tests/test-smite-foreign-install-real-nginx.py
      - tests/test-smite-foreign-install-promotion.py
      - tests/test-smite-foreign-install-integration.py
      - .github/workflows/foreign-install-client-trial.yml
permissions:
  contents: read
jobs:
  staged-client-and-panel-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: b865be93e22153c60769f6329e6e55e781494ded
          path: companion-smite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r companion-smite/panel/requirements.txt
      - run: python -B tests/test-smite-foreign-install-client.py -v
      - run: python -B tests/test-smite-unified-foreign-identity-phase.py -v
      - run: python -B tests/test-smite-unified-trial-pair-admission.py -v
      - run: python -B tests/test-smite-unified-panel-stage.py -v
      - run: bash tests/test-smite-unified-sanaei-continuation.sh
      - run: bash tests/test-smite-unified-foreign-after-core.sh
      - run: python -B tests/test-smite-unified-foreign-gateway-plan.py -v
      - run: bash tests/test-smite-unified-gateway-menu-boundary.sh
      - run: bash -n modules/smite-foreign-gateway.sh
      - run: bash tests/test-smite-integrated-ir-flow.sh
      - run: bash tests/test-smite-sanaei-result.sh
      - run: python -B tests/test-smite-unified-panel-transaction.py -v
      - run: python -B tests/test-smite-foreign-install-promotion.py -v
      - run: python -B tests/test-smite-foreign-install-panel-ingress.py -v
      - run: python -B tests/test-smite-foreign-install-integration.py -v
        env:
          SMITE_SOURCE: companion-smite

  nginx-443-foreign-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Nginx and OpenSSL fixtures
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nginx openssl
      - name: Exercise exact HTTPS POST admission and forged-header denial
        run: python -B tests/test-smite-foreign-install-real-nginx.py -v
