name: Foreign installation client trial
on:
  push:
    branches: [trial/unified-smite-install]
  pull_request:
    paths:
      - install.sh
      - u-opti
      - tests/test-uopti-update-file-list.py
      - modules/smite-foreign-install-client.py
      - modules/smite-unified-foreign-packet-intake.py
      - tests/test-smite-unified-foreign-packet-intake.py
      - modules/smite-unified-foreign-identity-phase.py
      - modules/smite-unified-foreign-host-recovery.py
      - modules/smite-unified-foreign-existing-witnesses.py
      - tests/test-smite-unified-foreign-existing-witnesses.py
      - tests/test-smite-unified-foreign-host-recovery.py
      - modules/smite-unified-foreign-activation-review.py
      - tests/test-smite-unified-foreign-activation-review.py
      - modules/smite-node-pairing.py
      - tests/test-smite-rc7-foreign-pairing.py
      - tests/test-smite-unified-foreign-identity-phase.py
      - tests/test-smite-foreign-install-client.py
      - modules/smite-unified-trial-pair-admission.py
      - modules/smite-unified-trial-registry-pair.json
      - tests/test-smite-unified-trial-pair-admission.py
      - modules/smite-unified-panel-stage.py
      - modules/smite-install.sh
      - modules/smite-rc6-install-journal.py
      - tests/test-smite-rc6-install-journal.py
      - tests/test-smite-selected-install.sh
      - tests/test-smite-integrated-ir-flow.sh
      - tests/test-smite-unified-foreign-after-core.sh
      - modules/smite-foreign-gateway.sh
      - modules/smite-unified-foreign-gateway-plan.py
      - tests/test-smite-unified-foreign-gateway-plan.py
      - tests/test-smite-unified-gateway-menu-boundary.sh
      - modules/docker-3xui.sh
      - tests/test-smite-unified-sanaei-continuation.sh
      - modules/smite-unified-panel-transaction.py
      - tests/test-smite-unified-panel-transaction.py
      - tests/test-smite-unified-panel-docker.sh
      - tests/test-smite-unified-panel-stage.py
      - tests/test-smite-unified-trial-pair-admission.py
      - modules/smite-foreign-install-promotion.py
      - modules/smite-foreign-install-panel-ingress.py
      - tests/test-smite-foreign-install-panel-ingress.py
      - tests/test-smite-foreign-install-real-nginx.py
      - tests/test-smite-foreign-install-promotion.py
      - tests/test-smite-foreign-install-integration.py
      - .github/workflows/foreign-install-client-trial.yml
permissions:
  contents: read
  packages: read
jobs:
  staged-client-and-panel-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: de0677d015a00160970ed57bba565adc4fafe8eb
          path: companion-smite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm companion checkout is the exact sealed Panel/Node source
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY_CHECK_COMPANION'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('modules/smite-unified-trial-registry-pair.json').read_bytes())
          expected=manifest['source_commit']
          observed=subprocess.check_output(
              ['git', '-C', 'companion-smite', 'rev-parse', 'HEAD'], text=True).strip()
          if observed != expected:
              raise SystemExit('HOLD: companion Smite source does not match signed pair')
          if manifest['release_approved'] is not False or manifest['activation_allowed'] is not False:
              raise SystemExit('HOLD: unreviewed release flag')
          print('EXACT_SIGNED_COMPANION_SOURCE=PASS_READ_ONLY')
          PY_CHECK_COMPANION
      - run: python -B tests/test-smite-unified-trial-pair-admission.py -v
      - run: python -m pip install -r companion-smite/panel/requirements.txt
      - run: python -B tests/test-smite-foreign-install-client.py -v
      - run: python -B tests/test-smite-unified-foreign-packet-intake.py -v
      - run: python -B tests/test-smite-unified-foreign-identity-phase.py -v
      - run: python -B tests/test-smite-unified-foreign-host-recovery.py -v
      - run: python -B tests/test-smite-unified-foreign-existing-witnesses.py -v
      - run: python -B tests/test-smite-unified-foreign-activation-review.py -v
      - run: python -B tests/test-smite-rc7-foreign-pairing.py -v
      - run: python -B tests/test-smite-unified-trial-pair-admission.py -v
      - run: python -B tests/test-smite-unified-panel-stage.py -v
      - run: bash tests/test-smite-unified-sanaei-continuation.sh
      - run: bash tests/test-smite-unified-foreign-after-core.sh
      - run: python -B tests/test-smite-unified-foreign-gateway-plan.py -v
      - run: bash tests/test-smite-unified-gateway-menu-boundary.sh
      - run: bash -n modules/smite-foreign-gateway.sh
      - run: python -B tests/test-uopti-update-file-list.py
      - run: sudo bash tests/test-smite-selected-install.sh
      - run: bash tests/test-smite-integrated-ir-flow.sh
      - run: sudo bash tests/test-smite-ir-gateway-stage-rollback.sh
      # The original fresh-install journal requires root-owned paths in
      # its disposable fixture. No real Docker/systemd services are touched.
      - run: sudo python -B tests/test-smite-rc6-install-journal.py -v
      - run: bash tests/test-smite-sanaei-result.sh
      - run: python -B tests/test-smite-unified-panel-transaction.py -v
      - run: python -B tests/test-smite-foreign-install-promotion.py -v
      - run: python -B tests/test-smite-foreign-install-panel-ingress.py -v
      - run: python -B tests/test-smite-foreign-install-integration.py -v
        env:
          SMITE_SOURCE: companion-smite

  nginx-443-foreign-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Nginx and OpenSSL fixtures
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nginx openssl
      - name: Exercise exact HTTPS POST admission and forged-header denial
        run: python -B tests/test-smite-foreign-install-real-nginx.py -v

  panel-compose-upgrade:
    if: github.repository == 'aghajani82/u-opti' && github.event_name == 'push' && github.ref == 'refs/heads/trial/unified-smite-install'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Verify published RC7 and trial image signatures
        run: |
          set -euo pipefail
          python3 -B modules/smite-registry-pair-admission.py \
            --manifest modules/smite-rc7-registry-pair.json \
            --manifest-sha256 58bebfc605a5c1a64cf02ce38e6397dbcdae5f1c3289a01952f361b6a8aa660e \
            --source-sha 9a1270b31e8d44f13d09b71ab6b9798410b09c12 \
            --publish-ref refs/tags/v2.0.0-rc.7
          python3 -B modules/smite-unified-trial-pair-admission.py \
            --manifest modules/smite-unified-trial-registry-pair.json \
            --manifest-sha256 61149003bbf966445bb25d0f94a4e666bb57b4544a5565703af55b30afa41c84 \
            --source-sha de0677d015a00160970ed57bba565adc4fafe8eb \
            --trusted-root modules/smite-rc7-sigstore-trusted-root.json
      - name: Exercise retained Panel migration and rollback with real Compose
        run: bash tests/test-smite-unified-panel-docker.sh
