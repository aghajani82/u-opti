name: Selected Stage15 signed install qualification
on:
  push:
    branches: [main]
    paths:
      - 'modules/smite-selected-candidate.json'
      - 'modules/smite-panel-ui.*'
      - 'tests/test-smite-panel-ui.py'
      - 'modules/smite-install.sh'
      - 'modules/smite-rc6-install-journal.py'
      - 'tests/test-smite-rc6-install-journal.py'
      - 'tests/test-smite-rc6-docker-retention.py'
      - '.github/workflows/stage15-selected-install.yml'
  pull_request:
    paths:
      - 'modules/smite-selected-candidate.json'
      - 'modules/smite-panel-ui.*'
      - 'tests/test-smite-panel-ui.py'
      - 'modules/smite-install.sh'
      - 'tests/test-smite-selected-install.sh'
      - 'modules/smite-rc6-install-journal.py'
      - 'tests/test-smite-rc6-install-journal.py'
      - 'tests/test-smite-rc6-docker-retention.py'
      - '.github/workflows/stage15-selected-install.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-signed-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: 9a1270b31e8d44f13d09b71ab6b9798410b09c12
          path: peer-smite
          persist-credentials: false
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Verify signatures without registry login
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$DOCKER_CONFIG"
          python3 -B modules/smite-registry-pair-admission.py \
            --manifest modules/smite-selected-candidate.json \
            --manifest-sha256 58bebfc605a5c1a64cf02ce38e6397dbcdae5f1c3289a01952f361b6a8aa660e \
            --source-sha 9a1270b31e8d44f13d09b71ab6b9798410b09c12 \
            --publish-ref refs/tags/v2.0.0-rc.7
      - name: Pull exact public images and verify revision labels
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          pair=json.load(open("modules/smite-selected-candidate.json"))
          for role in ("panel","node"):
              ref=pair["images"][role]
              subprocess.run(["docker","pull",ref],check=True)
              data=json.loads(subprocess.check_output(["docker","image","inspect",ref]))[0]
              labels=data["Config"]["Labels"]
              assert labels["smite.role"]==role
              assert labels["org.opencontainers.image.revision"]==pair["source_commit"]
              assert labels["org.opencontainers.image.version"]==pair["version"]
              subprocess.run(["docker","tag",ref,f"smite-{role}:stage15-local"],check=True)
          print("ANONYMOUS_SIGNED_RC7_PULL=PASS")
          PY
      - name: Reviewed UI bundle apply and rollback on disposable RC7 container
        run: |
          python3 -B tests/test-smite-panel-ui.py
          sudo -n python3 -B tests/test-smite-panel-ui.py --docker
      - name: Verify real published Panel includes the approved frontend
        run: |
          docker run --rm --network none --entrypoint python smite-panel:stage15-local -c "from pathlib import Path; p=Path('/app/static'); js=''.join(f.read_text() for f in p.rglob('*.js')); css=''.join(f.read_text() for f in p.rglob('*.css')); assert (p/'index.html').is_file(); assert 'smite-dashboard' in js and 'smite-login-card' in js; assert 'smite-dashboard' in css; print('RC7_REAL_IMAGE_FRONTEND=PASS')"
      - name: Actual RC7 isolated first boot and FRP bytes
        working-directory: peer-smite
        run: |
          set -euo pipefail
          python3 -B tests/stage15_frp_image_gate.py
          # Preserve every archived check; expect this exact RC7 instead of rc.0.
          python3 - <<'PY'
          from pathlib import Path
          import os
          source=Path('tests/stage16_isolated_firstboot.sh').read_text()
          old='assert version == "2.0.0-rc.0", version'
          assert source.count(old)==1
          Path(os.environ['RUNNER_TEMP'],'rc6-firstboot.sh').write_text(source.replace(old,'assert version == "2.0.0-rc.7", version'))
          PY
          bash "$RUNNER_TEMP/rc6-firstboot.sh"
      - name: Actual Node identity replay and paused rollback
        if: github.event_name == 'pull_request'
        working-directory: peer-smite
        run: bash tests/stage23_node_identity_rollback.sh
      - name: RC7 rollback retains real disposable Docker data
        run: sudo -n python3 -B tests/test-smite-rc6-docker-retention.py
      - name: Installer fixture regressions
        run: |
          set -euo pipefail
          sudo -n python3 -B tests/test-smite-rc6-install-journal.py
          sudo -n bash tests/test-smite-selected-install.sh
          bash tests/test-smite-clean-install.sh
          bash tests/test-smite-clean-iran-pending.sh
          bash tests/test-smite-clean-rc-nginx-preflight.sh
          sudo -n python3 -B tests/test-smite-guided-frp.py
          python3 -B tests/test-smite-registry-pair-admission.py
          echo "FRESH_VPS_NETWORK_TEST=PENDING_REAL_VPS"
