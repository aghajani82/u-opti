name: Selected Stage15 signed install qualification
on:
  pull_request:
    paths:
      - 'modules/smite-selected-candidate.json'
      - 'modules/smite-install.sh'
      - 'tests/test-smite-selected-install.sh'
      - '.github/workflows/stage15-selected-install.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-signed-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: 25ff25585be3f7ff1c8b73b39a23d0509f9a2312
          path: peer-smite
          persist-credentials: false
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Verify signatures without registry login
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$DOCKER_CONFIG"
          python3 -B modules/smite-registry-pair-admission.py \
            --manifest modules/smite-selected-candidate.json \
            --manifest-sha256 26d4a50e23b6707b414a81ae9b2ca4aaa45e491481d2eb487010dcb7540ab04c \
            --source-sha 25ff25585be3f7ff1c8b73b39a23d0509f9a2312 \
            --publish-ref refs/tags/v2.0.0-rc.6
      - name: Pull exact public images and verify revision labels
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          pair=json.load(open("modules/smite-selected-candidate.json"))
          for role in ("panel","node"):
              ref=pair["images"][role]
              subprocess.run(["docker","pull",ref],check=True)
              data=json.loads(subprocess.check_output(["docker","image","inspect",ref]))[0]
              labels=data["Config"]["Labels"]
              assert labels["smite.role"]==role
              assert labels["org.opencontainers.image.revision"]==pair["source_commit"]
              assert labels["org.opencontainers.image.version"]==pair["version"]
              subprocess.run(["docker","tag",ref,f"smite-{role}:stage15-local"],check=True)
          print("ANONYMOUS_SIGNED_RC6_PULL=PASS")
          PY
      - name: Actual RC6 isolated first boot and FRP bytes
        working-directory: peer-smite
        run: |
          set -euo pipefail
          python3 -B tests/stage15_frp_image_gate.py
          # Preserve every archived check; expect this exact RC6 instead of rc.0.
          python3 - <<'PY'
          from pathlib import Path
          import os
          source=Path('tests/stage16_isolated_firstboot.sh').read_text()
          old='assert version == "2.0.0-rc.0", version'
          assert source.count(old)==1
          Path(os.environ['RUNNER_TEMP'],'rc6-firstboot.sh').write_text(source.replace(old,'assert version == "2.0.0-rc.6", version'))
          PY
          bash "$RUNNER_TEMP/rc6-firstboot.sh"
      - name: Actual Node identity replay and paused rollback
        if: github.event_name == 'pull_request'
        working-directory: peer-smite
        run: bash tests/stage23_node_identity_rollback.sh
      - name: Installer fixture regressions
        run: |
          set -euo pipefail
          sudo -n bash tests/test-smite-selected-install.sh
          bash tests/test-smite-clean-install.sh
          bash tests/test-smite-clean-iran-pending.sh
          bash tests/test-smite-clean-rc-nginx-preflight.sh
          sudo -n python3 -B tests/test-smite-guided-frp.py
          echo "FRESH_VPS_NETWORK_TEST=PENDING"
