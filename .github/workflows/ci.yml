name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  managed-frp-signed-compose:
    # PR-only, isolated Docker with network:none, no published host port;
    # verifies actual signed Node inventory through full container recreate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout reviewed U-OPTI experimental code
        uses: actions/checkout@v4
      - name: Checkout exact reviewed Smite Node
        uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: a15c46288aae9849babc9c9358c68e46686bce9c
          path: .managed-smite-source
          persist-credentials: false
      - name: Signed official FRP dual-binary Compose recreation and rollback
        shell: bash
        run: |
          bash -n tests/test-smite-managed-frp-signed-compose.sh
          bash -n tests/test-smite-managed-backhaul-signed-api.sh
          python3 -m py_compile tests/smite-managed-backhaul-compose-fixture.py
          bash tests/test-smite-managed-frp-signed-compose.sh

  signed-runtime-verifier-offline:
    # Exact, immutable Smite HMAC implementation; mocked HTTP transport only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experimental U-OPTI branch
        uses: actions/checkout@v4
      - name: Checkout reviewed Smite HMAC implementation by immutable SHA
        uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: a15c46288aae9849babc9c9358c68e46686bce9c
          path: .managed-smite-source
          persist-credentials: false
      - name: Verify exact Smite revision and offline Signed Runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .managed-smite-source rev-parse HEAD)" = "a15c46288aae9849babc9c9358c68e46686bce9c"
          python3 -m py_compile tests/lab/smite_signed_runtime_probe.py tests/test-smite-signed-runtime-probe.py
          python3 -B tests/test-smite-signed-runtime-probe.py -v
  signed-fastapi-durable-replay-isolated:
    # New Smite strict replay lifecycle pinned by immutable SHA, ASGI only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout U-OPTI laboratory
        uses: actions/checkout@v4
      - name: Checkout immutable reviewed Smite API source
        uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: 3751aeda6f946e5e5624e5e89ab1ce554fec4460
          path: .managed-smite-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run FastAPI signed endpoints and durable replay across app recreation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .managed-smite-source rev-parse HEAD)" = "3751aeda6f946e5e5624e5e89ab1ce554fec4460"
          python3 -m pip install -r .managed-smite-source/node/requirements.txt
          python3 -m py_compile tests/test-smite-fastapi-durable-bridge.py
          python3 -B tests/test-smite-fastapi-durable-bridge.py -v

  signed-stage27-real-nginx-hmac-443:
    # Real loopback TLS/443 + Stage12 inert snippet -> actual Smite strict API.
    # Unique disposable PR runner, no public binding or production reload.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experimental U-OPTI code
        uses: actions/checkout@v4
      - name: Checkout immutable reviewed Smite strict Node source
        uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: 3751aeda6f946e5e5624e5e89ab1ce554fec4460
          path: .stage27-smite-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install disposable Nginx, OpenSSL and reviewed Smite Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .stage27-smite-src rev-parse HEAD)" = "3751aeda6f946e5e5624e5e89ab1ce554fec4460"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nginx openssl
          python3 -m pip install -r .stage27-smite-src/node/requirements.txt
      - name: Verify real TLS/SNI + exact signed path/query/body + missing DB fail-close
        shell: bash
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_EVENT_NAME: pull_request
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test-smite-stage27-signed-nginx-hmac.py
          python3 -B tests/test-smite-stage27-signed-nginx-hmac.py

  managed-frp-official-artifact:
    # Trusted official downloads only on disposable PR CI, never push/main.
    if: github.event_name == 'pull_request'
    name: managed-frp-official-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Verify upstream FRP archive and BOTH binaries without host activation
        shell: bash
        run: |
          bash -n tests/test-smite-managed-frp-official.sh
          bash tests/test-smite-managed-frp-official.sh "${{ matrix.arch }}"
  bash-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n u-opti
          bash -n lib/common.sh
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find modules -type f -name '*.sh' -print0 | sort -z)

      - name: Verify opt-in Smite Node identity pairing preview
        shell: bash
        run: |
          bash -n modules/smite-node-pairing-wizard.sh
          python3 -m py_compile modules/smite-node-pairing.py tests/test-smite-node-pairing.py
          python3 -B tests/test-smite-node-pairing.py -v

      - name: Fresh clean Smite IR/KH RC installation uses verified paired images only
        shell: bash
        run: |
          set -euo pipefail
          bash -n modules/smite-install.sh
          bash -n tests/test-smite-clean-install.sh
          python3 -m py_compile modules/smite-clean-image-pair.py tests/test-smite-clean-image-pair.py
          python3 -B tests/test-smite-clean-image-pair.py -v
          bash tests/test-smite-clean-install.sh

      - name: Phase1 Smite Core installs without host FRP, Stable requires original FRP
        shell: bash
        run: |
          bash -n tests/test-smite-core-no-frp.sh
          bash tests/test-smite-core-no-frp.sh

      - name: Independently stage Backhaul engine with pinned artifacts (no live install)
        shell: bash
        run: |
          python3 -m py_compile modules/smite-managed-backhaul.py tests/test-smite-managed-backhaul.py
          python3 -B tests/test-smite-managed-backhaul.py -v
          grep -Fq '"smite-managed-backhaul.py"' install.sh
          grep -Fq '"smite-managed-backhaul.py"' u-opti
          grep -Fq '["smite-managed-backhaul.py"]' u-opti
          python3 -m py_compile modules/smite-managed-frp.py modules/smite-managed-frp-control.py tests/test-smite-managed-frp.py tests/test-smite-managed-frp-control.py
          python3 -B tests/test-smite-managed-frp.py -v
          python3 -B tests/test-smite-managed-frp-control.py -v
          python3 -m py_compile modules/smite-managed-frp-transaction.py tests/test-smite-managed-frp-transaction.py
          python3 -B tests/test-smite-managed-frp-transaction.py -v
          grep -Fq '"smite-managed-frp-transaction.py"' install.sh
          grep -Fq '["smite-managed-frp-transaction.py"]' u-opti
          bash -n modules/smite-managed-frp-menu.sh
          for helper in smite-managed-frp.py smite-managed-frp-control.py smite-managed-frp-menu.sh; do
            grep -Fq "\"$helper\"" install.sh
            grep -Fq "\"$helper\"" u-opti
            grep -Fq "[$(printf '"%s"' "$helper")]" u-opti
          done


      - name: Rehearse isolated Backhaul activation, interrupted install and exact rollback
        shell: bash
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_EVENT_NAME: pull_request
        run: |
          python3 -m py_compile modules/smite-managed-backhaul-transaction.py tests/test-smite-managed-backhaul-transaction.py
          python3 -B tests/test-smite-managed-backhaul-transaction.py -v
          grep -Fq '"smite-managed-backhaul-transaction.py"' install.sh
          grep -Fq '"smite-managed-backhaul-transaction.py"' u-opti
          grep -Fq '["smite-managed-backhaul-transaction.py"]' u-opti
          python3 -m py_compile modules/smite-managed-backhaul-control.py tests/test-smite-managed-backhaul-control.py
          python3 -B tests/test-smite-managed-backhaul-control.py -v
          bash -n modules/smite-managed-backhaul-menu.sh
          grep -Fq '"smite-managed-backhaul-control.py"' install.sh
          grep -Fq '"smite-managed-backhaul-menu.sh"' install.sh
          grep -Fq '["smite-managed-backhaul-control.py"]' u-opti
          grep -Fq '["smite-managed-backhaul-menu.sh"]' u-opti
          python3 -m py_compile modules/smite-managed-backhaul-host-gate.py tests/test-smite-managed-backhaul-host-gate.py
          python3 -B tests/test-smite-managed-backhaul-host-gate.py -v
          python3 -m py_compile modules/smite-managed-engine-host-admission.py tests/test-smite-managed-engine-host-admission.py
          python3 -B tests/test-smite-managed-engine-host-admission.py -v
          python3 -m py_compile modules/smite-managed-engine-host-plan.py tests/test-smite-managed-engine-host-plan.py
          python3 -B tests/test-smite-managed-engine-host-plan.py -v
          # Lab-only: synthetic transactions; no host activation or Docker.
          python3 -m py_compile tests/lab/smite_host_executor.py tests/test-smite-host-executor-lab.py
          python3 -B tests/test-smite-host-executor-lab.py -v
          python3 -m py_compile tests/lab/smite_fd_guard.py tests/test-smite-fd-guard.py
          python3 -B tests/test-smite-fd-guard.py -v
          grep -Fq '"smite-managed-engine-host-plan.py"' install.sh
          grep -Fq '["smite-managed-engine-host-plan.py"]' u-opti
          grep -Fq '"smite-managed-engine-host-admission.py"' install.sh
          grep -Fq '["smite-managed-engine-host-admission.py"]' u-opti
          python3 -m py_compile modules/smite-managed-backhaul-pair-review.py tests/test-smite-managed-backhaul-pair-review.py
          python3 -B tests/test-smite-managed-backhaul-pair-review.py -v
          grep -Fq '"smite-managed-backhaul-host-gate.py"' install.sh
          grep -Fq '["smite-managed-backhaul-host-gate.py"]' u-opti
          grep -Fq '"smite-managed-backhaul-pair-review.py"' install.sh
          grep -Fq '["smite-managed-backhaul-pair-review.py"]' u-opti
          python3 -m py_compile modules/smite-managed-backhaul-lifecycle.py tests/test-smite-managed-backhaul-lifecycle.py tests/test-smite-managed-backhaul-lifecycle-official.py
          python3 -B tests/test-smite-managed-backhaul-lifecycle.py -v
          grep -Fq '"smite-managed-backhaul-lifecycle.py"' install.sh
          grep -Fq '["smite-managed-backhaul-lifecycle.py"]' u-opti

      - name: Verify clean RC IR signed Panel plus paused local Node, Stable unchanged
        shell: bash
        run: |
          bash -n tests/test-smite-clean-iran-pending.sh
          bash tests/test-smite-clean-iran-pending.sh

      - name: Verify clean RC foreign node paused pairing boot without HTTP 8000 fallback
        shell: bash
        run: |
          bash -n tests/test-smite-foreign-paused-boot.sh
          bash tests/test-smite-foreign-paused-boot.sh

      - name: Stage15 verify archive delivery with tampering and no-install regressions
        shell: bash
        run: |
          python3 -m py_compile modules/smite-stage15-bundle-verify.py tests/test-smite-stage15-bundle-verify.py
          python3 -B tests/test-smite-stage15-bundle-verify.py -v

      - name: Checkout pinned Stage14 Smite security source (source only, no images)
        uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: 631df78551e097dbded3b934ed6ea4987c554869
          path: .stage14-smite-src
          persist-credentials: false

      - name: Cross-repository Stage14 HMAC and admin JWT overlay regression
        shell: bash
        env:
          SMITE_STAGE14_SOURCE: ${{ github.workspace }}/.stage14-smite-src
        run: |
          set -euo pipefail
          python3 -m json.tool release/smite-stage14-integration-review.json >/dev/null
          python3 -m py_compile modules/smite-panel-auth-overlay.py tests/test-smite-panel-auth-overlay.py tests/test-smite-stage14-integration.py
          python3 -B tests/test-smite-panel-auth-overlay.py -v
          python3 -B tests/test-smite-stage14-integration.py -v

      - name: Stage19 pairing 443 private offline Nginx plan
        shell: bash
        run: |
          python3 -m py_compile modules/smite-stage19-pairing-443-plan.py tests/test-smite-stage19-pairing-443-plan.py
          python3 -B tests/test-smite-stage19-pairing-443-plan.py -v

      - name: Stage13 IR KH deployment admission never greenlights live auth
        shell: bash
        run: |
          python3 -m py_compile modules/smite-stage13-preflight.py tests/test-smite-stage13-preflight.py
          python3 -B tests/test-smite-stage13-preflight.py -v

      - name: Stage12 signed Agent HTTPS 443 Nginx candidate never rewrites HMAC path
        shell: bash
        run: |
          python3 -m py_compile modules/smite-stage12-nginx-hmac-plan.py tests/test-smite-stage12-nginx-hmac-plan.py
          python3 -B tests/test-smite-stage12-nginx-hmac-plan.py -v

      - name: Verify Stage11 secure FRP and Backhaul overlay migration review bundles
        shell: bash
        run: |
          python3 -m py_compile modules/smite-stage11-overlay-review.py tests/test-smite-stage11-overlay-review.py
          python3 -B tests/test-smite-stage11-overlay-review.py -v

      - name: Verify Smite auth image shadow compatibility source audit
        shell: bash
        run: |
          python3 -m py_compile modules/smite-auth-image-overlay-audit.py tests/test-smite-auth-image-overlay-audit.py
          python3 -B tests/test-smite-auth-image-overlay-audit.py -v

      - name: Verify inert Smite Node security Compose staging and rollback
        shell: bash
        run: |
          python3 -m py_compile modules/smite-node-auth-candidate.py tests/test-smite-node-auth-candidate.py
          python3 -B tests/test-smite-node-auth-candidate.py -v

      - name: Verify paired-only Foreign Smite gateway readiness
        shell: bash
        run: |
          python3 -m py_compile modules/smite-foreign-gateway-signed-check.py tests/test-smite-foreign-gateway-signed-check.py
          python3 -B tests/test-smite-foreign-gateway-signed-check.py -v

      - name: Verify secure Smite Node localhost/443 endpoint and update packaging
        shell: bash
        run: python3 -B tests/test-smite-node-local-bind.py

      - name: Verify isolated Smite FRP Compose override
        shell: bash
        run: bash tests/test-smite-frp-compose.sh

      - name: Verify Smite FRP 443 persistence and safe gateway repair
        shell: bash
        run: bash tests/test-smite-frp443-persistence.sh

      - name: Verify independent Standard FRP Wizard and ALPN recipe
        shell: bash
        run: bash tests/test-smite-frp-wizard.sh

      - name: Verify safe unified Tunnel Setup Wizard and protocol navigation
        shell: bash
        run: bash tests/test-smite-tunnel-wizard.sh

      - name: Verify pre-Smite profile-first planning and safe non-secret persistence
        shell: bash
        run: python3 -B tests/test-smite-profile-first.py

      - name: Verify Tunnel Control Center status, demo and navigation
        shell: bash
        run: bash tests/test-smite-tunnel-control-center.sh

      - name: Fail-closed read-only existing/new Backhaul audit tests
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-readiness.py

      - name: Verify custom Xray port/path exact private proposals and trial admission
        shell: bash
        run: python3 -B tests/test-smite-backhaul-sidecar-custom-profile.py

      - name: Verify fresh-host candidate admission and filesystem safety gates
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-admission.py

      - name: Test one-step private offline Backhaul preparation (mocked hosts)
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-guided-prep.py

      - name: Test guided one-flow disposable-host activation (mocked hosts)
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-guided-trial.py

      - name: Verify install/update module closure and isolated import smoke
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-package-closure.py

      - name: Test explicitly gated experimental host activation and rollback
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-live-trial.py

      - name: Validate safe IR token provisioning and no-overwrite policy
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-token.py

      - name: Verify strict SSH private token pairing on mocked IR/KH hosts
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-ssh-pair.py

      - name: Verify Bitvise pairing confirmation and safe fresh-host refusal
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-bitvise-menu.py

      - name: Verify safe IR/KH rebuild readiness gate without real services
        shell: bash
        run: bash tests/test-smite-backhaul-rebuild-gate.sh

      - name: Exercise experimental activation engine on synthetic filesystem only
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-live-engine.py

      - name: Test private offline IR/KH Nginx integration and rollback manifests
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-nginx-plan.py

      - name: Verify automatic Standard FRP XHTTP routing and rollback
        shell: bash
        run: bash tests/test-smite-frp-xhttp-auto.sh

      - name: Verify shared Sanaei vhost survives Foreign Gateway repair
        shell: bash
        run: bash tests/test-smite-foreign-shared-sanaei.sh

      - name: Verify shared Smite and Sanaei Docker Nginx installation
        shell: bash
        run: bash tests/test-smite-sanaei-nginx-shared-install.sh

      - name: Verify simulated shared HTTPS activation and rollback
        shell: bash
        run: bash tests/test-smite-sanaei-shared-activation.sh

      - name: Assert existing guided Smite Wizard is unchanged
        shell: bash
        run: bash tests/test-smite-wizard-preservation.sh

      - name: Validate opt-in Smite FRP 443 helper for pinned images
        shell: bash
        run: bash tests/test-smite-frp443-optin-helper.sh

      - name: Verify Standard FRP module bootstrap for legacy updates
        shell: bash
        run: bash tests/test-smite-frp-release-upgrade.sh

      - name: Test experimental Backhaul Standard renderer
        shell: bash
        run: |
          bash -n modules/smite-backhaul-standard.sh
          bash tests/test-smite-backhaul-standard.sh

      - name: Test Standard Backhaul fail-closed spec compiler
        shell: bash
        run: python3 tests/test-smite-backhaul-spec.py

      - name: Test independent Backhaul Sidecar offline candidates
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-sidecar.py
          python3 tests/test-smite-backhaul-sidecar.py

      - name: Verify Sidecar host-port inventory and rollback simulation
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-sidecar-audit.py
          python3 -m py_compile modules/smite-backhaul-sidecar-rollback.py
          python3 tests/test-smite-backhaul-sidecar-audit.py
          python3 tests/test-smite-backhaul-sidecar-rollback.py

      - name: Review simulated final Sidecar host evidence with strict safety gate
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-sidecar-preflight.py
          python3 tests/test-smite-backhaul-sidecar-preflight.py

      - name: Ensure Backhaul host evidence collection is read-only and redacted
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-sidecar-collect.py
          python3 tests/test-smite-backhaul-sidecar-collect.py

      - name: Simulate isolated Sidecar installation and exact rollback
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-sidecar-sandbox.py
          python3 tests/test-smite-backhaul-sidecar-sandbox.py

      - name: Simulate crash-resumable Sidecar file journal and rollback
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-sidecar-recovery-lab.py
          python3 tests/test-smite-backhaul-sidecar-recovery-lab.py

      - name: Coordinate synthetic file and service transactions with resumable rollback
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-transaction-lab.py

      - name: Verify unified staged IR/KH Nginx and Sidecar rollback scope
        shell: bash
        run: |
          python3 -B tests/test-smite-backhaul-sidecar-unified-lab.py

      - name: Verify Sidecar no-execution installation blueprint and backup provenance
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-sidecar-activation-plan.py
          python3 tests/test-smite-backhaul-sidecar-activation-plan.py

      - name: Validate candidate Backhaul node adapter patch
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-node-patch.py
          python3 tests/test-smite-backhaul-node-patch.py

      - name: Validate Standard Backhaul panel candidate patch
        shell: bash
        run: |
          python3 -m py_compile modules/smite-backhaul-panel-patch.py
          python3 tests/test-smite-backhaul-panel-patch.py

      - name: Validate Standard Backhaul prepare-only packaging
        shell: bash
        run: |
          bash -n modules/smite-backhaul-management.sh
          bash tests/test-smite-backhaul-packaging.sh
          bash tests/test-smite-backhaul-management.sh

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "**v${version}**" README.md
          grep -Fq "Current stable version: **v${version}**" CATALOG.md
          grep -Fq "## [${version}]" CHANGELOG.md

      - name: Validate Smite EasyTier packaging
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"smite-private-network.sh"' install.sh
          grep -Fq '"smite-easytier.sh"' install.sh
          grep -Fq 'show_smite_private_network_menu()' modules/smite-private-network.sh
          grep -Fq 'show_smite_easytier_menu()' modules/smite-easytier.sh
          grep -Fq 'docker_smite_ensure_private_network_modules()' modules/docker.sh

  sidecar-image-smoke:
    # Isolated GitHub-hosted runner only. No access to live IR/KH servers.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate isolated Compose candidates
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          openssl rand -hex 32 > "$tmp/token"
          for role in ir kh; do
            output="$(python3 modules/smite-backhaul-sidecar.py \
              --role "$role" --token-file "$tmp/token")"
            stage="$(printf '%s\n' "$output" | sed -n "s/^PREPARED PRIVATE OFFLINE CANDIDATE: \(.*\) ($role)$/\1/p")"
            test -n "$stage" && test -d "$stage"
            docker compose -f "$stage/compose.candidate.yaml" config --quiet
            echo "Offline $role Compose candidate: valid syntax"
            rm -rf -- "$stage"
          done

