# One-time build of reviewed static assets. Removed before PR merge.
name: Temporary pinned Smite operator-width UI bundle (one-shot)
on:
  push:
    branches: [fix/smite-ui-all-routes-fluid-20261108]
    paths: ['.github/workflows/ui-all-routes-pin-temp.yml']
permissions:
  contents: write
jobs:
  embed-verified-smite-main-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: 5e7a289071e446345ac27e4255994daf3446430a
          path: smite-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smite-source/frontend/package-lock.json
      - name: Compile exactly reviewed Smite main source
        working-directory: smite-source/frontend
        run: |
          npm ci
          npm run build
      - name: Compare compiled files against passing Smite main CI and pin static bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, re
          root=pathlib.Path('smite-source/frontend/dist')
          expected={
            'assets/index-B4YJt7yO.js':'54706d8104b87737d5d0c729dcd446eb95d06adcf9867fb7126604a804045abc',
            'assets/index-c0Ew1NGv.css':'04e9a42ebe70e3015f7ff9d790aa8b6002895e61261e5cfe03627dee9a6c6060',
            'index.html':'3c1847df89c7e68824d85ed06010feac76a84504f3946421a1bd0fb9f96ff8db'
          }
          names={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if names!=set(expected) or any(p.is_symlink() for p in root.rglob('*')):
              raise SystemExit('HOLD: rebuilt static file set differs from approved Smite main CI artifact')
          for name,sha in expected.items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=sha:
                  raise SystemExit('HOLD: static digest differs from approved Smite main CI: '+name)
          css=(root/'assets/index-c0Ew1NGv.css').read_text()
          if '@media (min-width: 1024px){html{font-size:90%}}' not in css:
              raise SystemExit('HOLD: 90-percent density CSS missing')
          source_sha='5e7a289071e446345ac27e4255994daf3446430a'
          obj={'source_sha':source_sha,'workflow_run':42513266989,
               'files':{name:base64.b64encode((root/name).read_bytes()).decode('ascii') for name in sorted(expected)}}
          raw=(json.dumps(obj,sort_keys=True,separators=(',',':'))+'\n').encode()
          pathlib.Path('modules/smite-panel-ui.json').write_bytes(raw)
          checksum=hashlib.sha256(raw).hexdigest()
          helper=pathlib.Path('modules/smite-panel-ui.py')
          src=helper.read_text()
          src,count=re.subn(r"(?m)^BUNDLE_SHA = '[a-f0-9]{64}'$", "BUNDLE_SHA = '"+checksum+"'",src)
          if count!=1:raise SystemExit('HOLD: helper digest pin not unique')
          src,count=re.subn(r"(?m)^SOURCE = '[a-f0-9]{40}'$", "SOURCE = '"+source_sha+"'",src)
          if count!=1:raise SystemExit('HOLD: helper source pin not unique')
          helper.write_text(src)
          doc=pathlib.Path('docs/SMITE-PANEL-UI-UPDATE.md')
          content=doc.read_text()
          if content.count('REPLACE_WITH_VERIFIED_FULLWIDTH_BUNDLE_SHA')!=1:
              raise SystemExit('HOLD: doc digest marker missing')
          doc.write_text(content.replace('REPLACE_WITH_VERIFIED_FULLWIDTH_BUNDLE_SHA',checksum))
          print('MAIN_SOURCE='+source_sha)
          print('STATIC_BUNDLE_SHA256='+checksum)
          print('LIVE_DEPLOYMENT=NONE')
          PY
      - name: Test pinned static assets, update, backup, rollback and image admission
        run: |
          python3 -m py_compile modules/smite-panel-ui.py tests/test-smite-panel-ui.py
          python3 -B tests/test-smite-panel-ui.py -v
      - name: Commit only reviewed UI assets to the candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/smite-panel-ui.json modules/smite-panel-ui.py docs/SMITE-PANEL-UI-UPDATE.md
          git diff --cached --quiet && { echo 'HOLD: no static assets changed'; exit 1; }
          git commit -m 'fix(ui): pin reviewed Smite main full-width operator pages'
          git push origin HEAD:fix/smite-ui-all-routes-fluid-20261108
