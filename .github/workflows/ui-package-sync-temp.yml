name: Temporary pinned UI payload synchronization (remove before merge)

on:
  push:
    branches:
      - fix/smite-ui-90-pinned-bundle-20261108
    paths:
      - '.github/workflows/ui-package-sync-temp.yml'

permissions:
  contents: write

jobs:
  pin-reviewed-static-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: d4b318de24faff3261a93687c37c52ca6a2a0acc
          path: smite-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smite-source/frontend/package-lock.json
      - name: Compile immutable and audited Smite main UI
        working-directory: smite-source/frontend
        run: |
          npm ci
          npm run build
      - name: Verify compiled files exactly match successful Smite main CI evidence; embed with SHA pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, re
          root=pathlib.Path('smite-source/frontend/dist')
          expected={
            'assets/index-BEGdlx2C.css':'2509570fe684497f573cf389091e0dc9c86e896c5f42cfcc4a95f44d64c54a95',
            'assets/index-CBheFV49.js':'e760f83e0c2bb264461bdaa34075fd6d82fe4070214d8f7b9cb1471c4481fc4b',
            'index.html':'7ffb90cdae0a2b763c7e65704b5ea8f3ead7c521ae183cd3cba2545c4f643332',
          }
          names={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if names!=set(expected) or any(p.is_symlink() for p in root.rglob('*')):
              raise SystemExit('HOLD: built asset set differs from reviewed Smite CI artifact')
          for path, sha in expected.items():
              actual=hashlib.sha256((root/path).read_bytes()).hexdigest()
              if sha!=actual: raise SystemExit('HOLD: unreviewed static asset: '+path)
          css=(root/'assets/index-BEGdlx2C.css').read_text()
          if '@media (min-width: 1024px){html{font-size:90%}}' not in css:
              raise SystemExit('HOLD: 90% CSS marker absent')
          obj={'source_sha':'d4b318de24faff3261a93687c37c52ca6a2a0acc','workflow_run':42504320814,
               'files':{p:base64.b64encode((root/p).read_bytes()).decode('ascii') for p in sorted(expected)}}
          raw=(json.dumps(obj,sort_keys=True,separators=(',',':'))+'\n').encode()
          target=pathlib.Path('modules/smite-panel-ui.json')
          target.write_bytes(raw)
          checksum=hashlib.sha256(raw).hexdigest()
          helper=pathlib.Path('modules/smite-panel-ui.py')
          src=helper.read_text()
          src,count=re.subn(r"(?m)^BUNDLE_SHA = '[a-f0-9]{64}'$", "BUNDLE_SHA = '"+checksum+"'",src)
          if count!=1:raise SystemExit('HOLD: cannot pin bundle checksum')
          src,count=re.subn(r"(?m)^SOURCE = '[a-f0-9]{40}'$", "SOURCE = '"+obj['source_sha']+"'",src)
          if count!=1:raise SystemExit('HOLD: cannot pin source')
          helper.write_text(src)
          print('PINNED_SMITE_SOURCE='+obj['source_sha'])
          print('PINNED_UOPTI_BUNDLE_SHA256='+checksum)
          print('NO_SERVER_ACTIONS=YES')
          PY
      - name: Offline unit tests before writing commit
        run: python3 -m unittest discover -s tests -p 'test-smite-panel-ui.py'
      - name: Commit verified static assets and digest to candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/smite-panel-ui.json modules/smite-panel-ui.py
          git diff --cached --quiet && { echo 'HOLD: no payload update'; exit 1; }
          git commit -m 'fix(ui): pin verified 90-percent Smite main static bundle'
          git push origin HEAD:fix/smite-ui-90-pinned-bundle-20261108
