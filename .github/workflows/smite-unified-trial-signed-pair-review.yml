name: Verify Unified Smite Trial Signed Pair (read only)

on:
  push:
    branches: [trial/unified-smite-install]
    paths:
      - 'modules/smite-unified-trial-registry-pair.json'
      - 'modules/smite-unified-trial-pair-admission.py'
      - 'modules/smite-registry-pair-admission.py'
      - 'modules/smite-rc7-sigstore-trusted-root.json'
      - 'tests/test-smite-unified-trial-pair-admission.py'
      - '.github/workflows/smite-unified-trial-signed-pair-review.yml'
      - 'docs/RC9_OWNER_RELEASE_APPROVAL_REQUEST.json'
      - 'docs/RC9_RETAINED_PANEL_APPROVAL.json'
      - 'modules/smite-rc9-retained-panel.py'
      - 'tests/test-smite-rc9-retained-panel-docker.py'

permissions:
  contents: read
  packages: read

jobs:
  independent-ghcr-cosign:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    if: github.repository == 'aghajani82/u-opti' && github.ref == 'refs/heads/trial/unified-smite-install' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate immutable U-OPTI source, manifest hash, and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60  modules/smite-unified-trial-registry-pair.json' | sha256sum -c -
          python3 -B tests/test-smite-unified-trial-pair-admission.py -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Independently verify BOTH registry signatures and tagged publisher OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          python3 -B modules/smite-unified-trial-pair-admission.py \
            --manifest modules/smite-unified-trial-registry-pair.json \
            --manifest-sha256 f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60 \
            --source-sha e7f76185e9a7da51d7069d5d0a829dc192cc1e06 \
            --trusted-root modules/smite-rc7-sigstore-trusted-root.json
          echo HOST_INSTALL_ALLOWED=NO
          echo OFFICIAL_RELEASE_APPROVED=NO

  owner-approved-release:
    # This is the SAME EXISTING review workflow, run only after a
    # deliberate owner-approved request change. Other pushes stay read-only.
    # GitHub push event filename arrays may be absent for Contents API
    # commits. Select ONLY the exact owner sign-off commit message; the
    # job itself checks the complete before..after diff, request transition
    # and original source/digest/issuer pins BEFORE minting anything.
    if: >-
      github.repository == 'aghajani82/u-opti' &&
      github.actor == 'aghajani82' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/trial/unified-smite-install' &&
      github.event.head_commit.message == 'release(rc9): owner-approved signed artifact for disposable Iran + Foreign host test only'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Full history is required to compare github.event.before
          # through github.sha, including an owner push of many commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check owner-edited request and exact signed candidate (NO host writes)
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = aghajani82
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/trial/unified-smite-install
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git log -1 --format=%s)" = 'release(rc9): owner-approved signed artifact for disposable Iran + Foreign host test only'
          # Check the ENTIRE push range, not just HEAD^..HEAD. A
          # multi-commit push changing the verifier or workflow before
          # the final approval-file commit must not mint a release blob.
          [[ "$PUSH_BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]] || exit 2
          git cat-file -e "$PUSH_BEFORE_SHA^{commit}" || exit 2
          git merge-base --is-ancestor "$PUSH_BEFORE_SHA" "$GITHUB_SHA" || exit 2
          test "$(git diff --name-only "$PUSH_BEFORE_SHA" "$GITHUB_SHA")" = docs/RC9_OWNER_RELEASE_APPROVAL_REQUEST.json
          python3 -B - <<'PY_OWNER_REQUEST'
          import json,os,pathlib,subprocess
          path=pathlib.Path('docs/RC9_OWNER_RELEASE_APPROVAL_REQUEST.json')
          def unique(items):
              result={}
              for k,v in items:
                  if k in result: raise ValueError('duplicate key')
                  result[k]=v
              return result
          doc=json.loads(path.read_bytes(),object_pairs_hook=unique)
          assert set(doc)=={'schema','approved','source_sha','candidate_sha256','approved_sha256','scope'}
          assert doc['schema']==1 and doc['approved'] is True
          assert doc['source_sha']=='e7f76185e9a7da51d7069d5d0a829dc192cc1e06'
          assert doc['candidate_sha256']=='f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60'
          assert doc['approved_sha256']=='a2c368a9f7da64e0494b8c6534cdccd2f4a11974927983fe298596b41ffcef2f'
          assert doc['scope']=='fresh-two-host-rc9'
          # Require an actual one-way owner decision. A second push that
          # only reformats an already-approved file must NEVER sign again.
          before=subprocess.run(
              ['git','show',os.environ['PUSH_BEFORE_SHA']+':'+str(path)],
              check=True,capture_output=True).stdout
          prior=json.loads(before,object_pairs_hook=unique)
          assert set(prior)==set(doc) and prior['approved'] is False
          assert all(prior[k]==doc[k] for k in doc if k!='approved')
          print('OWNER_RELEASE_REQUEST=EXPLICIT_FALSE_TO_TRUE_ONLY')
          PY_OWNER_REQUEST
          echo 'f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60  modules/smite-unified-trial-registry-pair.json' | sha256sum -c -
          python3 -B tests/test-smite-unified-trial-pair-admission.py -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Independently reverify exact two signed RC9 image digests
        run: |
          set -euo pipefail
          python3 -B modules/smite-unified-trial-pair-admission.py \
            --manifest modules/smite-unified-trial-registry-pair.json \
            --manifest-sha256 f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60 \
            --source-sha e7f76185e9a7da51d7069d5d0a829dc192cc1e06 \
            --trusted-root modules/smite-rc7-sigstore-trusted-root.json
      - name: Produce exact reviewed approved-manifest bytes (NO host changes)
        shell: bash
        env:
          EXPECTED_APPROVED_SHA: a2c368a9f7da64e0494b8c6534cdccd2f4a11974927983fe298596b41ffcef2f
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc9-owner-release"
          python3 -B - "$RUNNER_TEMP/rc9-owner-release/approved-manifest.json" <<'PY_RELEASE'
          import hashlib,json,sys,pathlib
          def unique(pairs):
              out={}
              for key,value in pairs:
                  if key in out: raise ValueError('duplicate field')
                  out[key]=value
              return out
          candidate=pathlib.Path('modules/smite-unified-trial-registry-pair.json')
          doc=json.loads(candidate.read_bytes(),object_pairs_hook=unique)
          assert set(doc)=={'schema','kind','source_repo','source_commit','publish_ref','version','images','activation_allowed','release_approved'}
          assert doc['schema']==1 and doc['source_repo']=='aghajani82/Smite'
          assert doc['source_commit']=='e7f76185e9a7da51d7069d5d0a829dc192cc1e06'
          assert doc['publish_ref']=='refs/tags/v2.0.0-rc.9'
          assert doc['release_approved'] is False and doc['activation_allowed'] is False
          assert doc['images']=={
              'panel':'ghcr.io/aghajani82/smite-panel@sha256:f6999effd131f6b3272f8d9116b3fbae917f699bf9a29271fc5ede24cc387a2e',
              'node':'ghcr.io/aghajani82/smite-node@sha256:3df3c9d40c338ab87205bbe93e9ab9bd94eb4051558c4429fdd09f876b76b2c2'}
          doc['release_approved']=True
          doc['activation_allowed']=True
          output=pathlib.Path(sys.argv[1])
          output.write_bytes((json.dumps(doc,sort_keys=True,separators=(',',':'))+'\n').encode())
          print('REVIEWED_APPROVAL_SHA256='+hashlib.sha256(output.read_bytes()).hexdigest())
          PY_RELEASE
          test "$(sha256sum "$RUNNER_TEMP/rc9-owner-release/approved-manifest.json" | cut -d' ' -f1)" = "$EXPECTED_APPROVED_SHA"
      - name: Sign approved bytes with exact GitHub owner Workflow OIDC and verify blob
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/rc9-owner-release"
          identity='https://github.com/aghajani82/u-opti/.github/workflows/smite-unified-trial-signed-pair-review.yml@refs/heads/trial/unified-smite-install'
          cosign sign-blob --yes --bundle "$dir/approved.sigstore.json" "$dir/approved-manifest.json" >/dev/null
          cosign verify-blob --bundle "$dir/approved.sigstore.json" \
            --trusted-root modules/smite-rc7-sigstore-trusted-root.json \
            --certificate-identity="$identity" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha="$GITHUB_SHA" \
            --certificate-github-workflow-repository=aghajani82/u-opti \
            --certificate-github-workflow-trigger=push \
            "$dir/approved-manifest.json" >/dev/null
          echo 'OWNER_RELEASE_BLOB_SIGNATURE=VERIFIED_NO_DEPLOYMENT'
          sha256sum "$dir/approved-manifest.json" "$dir/approved.sigstore.json"
      - uses: actions/upload-artifact@v4
        with:
          name: smite-rc9-signed-host-release-${{ github.sha }}
          path: ${{ runner.temp }}/rc9-owner-release/
          retention-days: 7
          if-no-files-found: error

  owner-approved-retained-panel:
    needs: retained-panel-rehearsal
    if: >-
      github.repository == 'aghajani82/u-opti' &&
      github.actor == 'aghajani82' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/trial/unified-smite-install' &&
      github.event.head_commit.message == 'release(rc9): authorize retained Iran Panel upgrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Verify the exact owner decision and signed Panel digest
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$BEFORE"
          request=docs/RC9_RETAINED_PANEL_APPROVAL.json
          test "$(git diff --name-status "$BEFORE" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$request")"
          mkdir -p "$RUNNER_TEMP/retained-panel-release"
          cp "$request" "$RUNNER_TEMP/retained-panel-release/approved.json"
          python3 -B - "$request" <<'PY_APPROVAL'
          import json
          from pathlib import Path
          import sys
          module = Path("modules/smite-rc9-retained-panel.py")
          sys.path.insert(0, str(module.parent))
          import runpy
          helper = runpy.run_path(str(module))
          data = Path(sys.argv[1]).read_bytes()
          assert data == helper["release_bytes"]()
          assert json.loads(data) == {
              "activation_allowed": True,
              "image": "ghcr.io/aghajani82/smite-panel@sha256:02538fece887a82fd49815514722aceb472d18956d05f49e5561d3ebdc206567",
              "scope": "retained_rc9_iran_panel_only",
              "schema": 1,
              "source_sha": "159174eb523a91e82292effd4930341b9b72e384",
          }
          PY_APPROVAL
          cosign verify --trusted-root modules/smite-rc7-sigstore-trusted-root.json \
            --certificate-identity=https://github.com/aghajani82/Smite/.github/workflows/unified-install-signed-trial.yml@refs/heads/trial/unified-smite-install \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository=aghajani82/Smite \
            --certificate-github-workflow-trigger=push \
            --certificate-github-workflow-sha=159174eb523a91e82292effd4930341b9b72e384 \
            -a smite_role=panel -a smite_trial=unified-install \
            -a smite_source_sha=159174eb523a91e82292effd4930341b9b72e384 \
            ghcr.io/aghajani82/smite-panel@sha256:02538fece887a82fd49815514722aceb472d18956d05f49e5561d3ebdc206567 >/dev/null
      - name: Sign and independently verify the retained Panel host authorization
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/retained-panel-release"
          cosign sign-blob --yes --bundle "$dir/approved.sigstore.json" "$dir/approved.json" >/dev/null
          cosign verify-blob --trusted-root modules/smite-rc7-sigstore-trusted-root.json \
            --bundle "$dir/approved.sigstore.json" \
            --certificate-identity=https://github.com/aghajani82/u-opti/.github/workflows/smite-unified-trial-signed-pair-review.yml@refs/heads/trial/unified-smite-install \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository=aghajani82/u-opti \
            --certificate-github-workflow-trigger=push \
            --certificate-github-workflow-sha="$GITHUB_SHA" - <"$dir/approved.json" >/dev/null
          sha256sum "$dir/approved.sigstore.json"
          # Public Sigstore bundle so it can be reviewed and packaged independently.
          printf 'RETAINED_PANEL_BUNDLE_BASE64=%s\n' "$(base64 -w0 "$dir/approved.sigstore.json")"
      - uses: actions/upload-artifact@v4
        with:
          name: smite-rc9-retained-panel-release-${{ github.sha }}
          path: ${{ runner.temp }}/retained-panel-release/
          if-no-files-found: error

  retained-panel-rehearsal:
    if: github.repository == 'aghajani82/u-opti' && github.ref == 'refs/heads/trial/unified-smite-install' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aghajani82/Smite
          ref: e7f76185e9a7da51d7069d5d0a829dc192cc1e06
          path: rc9-baseline
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recreate only the fixture Panel and compare the retained runtime
        env:
          UOPTI_DISPOSABLE_DOCKER_LAB: 'YES'
        run: sudo --preserve-env=UOPTI_DISPOSABLE_DOCKER_LAB,HOME python3 -B tests/test-smite-rc9-retained-panel-docker.py rc9-baseline/docker-compose.yml
      - uses: sigstore/cosign-installer@v4.1.0
        if: hashFiles('modules/smite-rc9-retained-panel-approved.sigstore.json') != ''
        with:
          cosign-release: 'v3.0.6'
      - name: Exercise the packaged host authorization check
        if: hashFiles('modules/smite-rc9-retained-panel-approved.sigstore.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          lab="$(sudo mktemp -d /root/retained-panel-verify.XXXXXX)"
          trap 'sudo rm -rf "$lab"' EXIT
          sudo install -m 0755 "$(command -v cosign)" "$lab/cosign"
          sudo install -m 0644 modules/{smite-rc9-retained-panel*,smite-rc7-wss-runtime.py,smite-rc7-wss-preflight.py,smite-registry-pair-admission.py,smite-rc7-sigstore-trusted-root.json,smite-install.sh} "$lab/"
          sudo env "PATH=$lab:/usr/bin:/bin" "HOME=$HOME" python3 -B - "$lab" <<'PY_VERIFY'
          from pathlib import Path
          import runpy
          import sys
          from types import SimpleNamespace
          from unittest.mock import patch

          lab = Path(sys.argv[1])
          runtime = SimpleNamespace(**runpy.run_path(str(lab / "smite-rc7-wss-runtime.py")))
          verify = runpy.run_path(str(lab / "smite-rc9-retained-panel.py"))["signed_release"]
          verify(runtime)
          print("RC9_PACKAGED_PANEL_HOST_AUTHORIZATION=PASS")
          verify.__globals__["STATE"] = lab / "fixture-state"
          with patch("shutil.which", return_value=None):
              verify(runtime)
          assert not list(lab.glob("smite-panel-cosign-*"))
          print("RC9_TEMPORARY_COSIGN_HOST_AUTHORIZATION=PASS")
          PY_VERIFY
