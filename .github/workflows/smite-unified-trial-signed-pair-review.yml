name: Verify Unified Smite Trial Signed Pair (read only)

on:
  push:
    branches: [trial/unified-smite-install]
    paths:
      - 'modules/smite-unified-trial-registry-pair.json'
      - 'modules/smite-unified-trial-pair-admission.py'
      - 'modules/smite-registry-pair-admission.py'
      - 'modules/smite-rc7-sigstore-trusted-root.json'
      - 'tests/test-smite-unified-trial-pair-admission.py'
      - '.github/workflows/smite-unified-trial-signed-pair-review.yml'
      - 'docs/RC9_OWNER_RELEASE_APPROVAL_REQUEST.json'

permissions:
  contents: read
  packages: read

jobs:
  independent-ghcr-cosign:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    if: github.repository == 'aghajani82/u-opti' && github.ref == 'refs/heads/trial/unified-smite-install' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate immutable U-OPTI source, manifest hash, and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60  modules/smite-unified-trial-registry-pair.json' | sha256sum -c -
          python3 -B tests/test-smite-unified-trial-pair-admission.py -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Independently verify BOTH registry signatures and tagged publisher OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          python3 -B modules/smite-unified-trial-pair-admission.py \
            --manifest modules/smite-unified-trial-registry-pair.json \
            --manifest-sha256 f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60 \
            --source-sha e7f76185e9a7da51d7069d5d0a829dc192cc1e06 \
            --trusted-root modules/smite-rc7-sigstore-trusted-root.json
          echo HOST_INSTALL_ALLOWED=NO
          echo OFFICIAL_RELEASE_APPROVED=NO

  owner-approved-release:
    # This is the SAME EXISTING review workflow, run only after a
    # deliberate owner-approved request change. Other pushes stay read-only.
    # Only an operator's deliberate EDIT of the existing approval request
    # can select this job on the trial branch. No default-branch dispatch,
    # no push with unrelated source changes, no auto-publish on review.
    if: github.repository == 'aghajani82/u-opti' && github.actor == 'aghajani82' && github.event_name == 'push' && github.ref == 'refs/heads/trial/unified-smite-install' && contains(github.event.head_commit.modified, 'docs/RC9_OWNER_RELEASE_APPROVAL_REQUEST.json')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check owner-edited request and exact signed candidate (NO host writes)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = aghajani82
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/trial/unified-smite-install
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # The sign-off push must change ONLY the original approval
          # request file, not source, verifier, policy or workflow code.
          test "$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")" = docs/RC9_OWNER_RELEASE_APPROVAL_REQUEST.json
          python3 -B - <<'PY_OWNER_REQUEST'
          import json,pathlib
          path=pathlib.Path('docs/RC9_OWNER_RELEASE_APPROVAL_REQUEST.json')
          def unique(items):
              result={}
              for k,v in items:
                  if k in result: raise ValueError('duplicate key')
                  result[k]=v
              return result
          doc=json.loads(path.read_bytes(),object_pairs_hook=unique)
          assert set(doc)=={'schema','approved','source_sha','candidate_sha256','approved_sha256','scope'}
          assert doc['schema']==1 and doc['approved'] is True
          assert doc['source_sha']=='e7f76185e9a7da51d7069d5d0a829dc192cc1e06'
          assert doc['candidate_sha256']=='f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60'
          assert doc['approved_sha256']=='a2c368a9f7da64e0494b8c6534cdccd2f4a11974927983fe298596b41ffcef2f'
          assert doc['scope']=='fresh-two-host-rc9'
          print('OWNER_RELEASE_REQUEST=EXPLICIT_EXACT_REVIEW')
          PY_OWNER_REQUEST
          echo 'f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60  modules/smite-unified-trial-registry-pair.json' | sha256sum -c -
          python3 -B tests/test-smite-unified-trial-pair-admission.py -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Independently reverify exact two signed RC9 image digests
        run: |
          set -euo pipefail
          python3 -B modules/smite-unified-trial-pair-admission.py \
            --manifest modules/smite-unified-trial-registry-pair.json \
            --manifest-sha256 f242e24710d87cef2a48a562d0fd3f16c37d553fb1cb9a8888d3de3cb4fc8e60 \
            --source-sha e7f76185e9a7da51d7069d5d0a829dc192cc1e06 \
            --trusted-root modules/smite-rc7-sigstore-trusted-root.json
      - name: Produce exact reviewed approved-manifest bytes (NO host changes)
        shell: bash
        env:
          EXPECTED_APPROVED_SHA: a2c368a9f7da64e0494b8c6534cdccd2f4a11974927983fe298596b41ffcef2f
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc9-owner-release"
          python3 -B - "$RUNNER_TEMP/rc9-owner-release/approved-manifest.json" <<'PY_RELEASE'
          import hashlib,json,sys,pathlib
          def unique(pairs):
              out={}
              for key,value in pairs:
                  if key in out: raise ValueError('duplicate field')
                  out[key]=value
              return out
          candidate=pathlib.Path('modules/smite-unified-trial-registry-pair.json')
          doc=json.loads(candidate.read_bytes(),object_pairs_hook=unique)
          assert set(doc)=={'schema','kind','source_repo','source_commit','publish_ref','version','images','activation_allowed','release_approved'}
          assert doc['schema']==1 and doc['source_repo']=='aghajani82/Smite'
          assert doc['source_commit']=='e7f76185e9a7da51d7069d5d0a829dc192cc1e06'
          assert doc['publish_ref']=='refs/tags/v2.0.0-rc.9'
          assert doc['release_approved'] is False and doc['activation_allowed'] is False
          assert doc['images']=={
              'panel':'ghcr.io/aghajani82/smite-panel@sha256:f6999effd131f6b3272f8d9116b3fbae917f699bf9a29271fc5ede24cc387a2e',
              'node':'ghcr.io/aghajani82/smite-node@sha256:3df3c9d40c338ab87205bbe93e9ab9bd94eb4051558c4429fdd09f876b76b2c2'}
          doc['release_approved']=True
          doc['activation_allowed']=True
          output=pathlib.Path(sys.argv[1])
          output.write_bytes((json.dumps(doc,sort_keys=True,separators=(',',':'))+'\n').encode())
          print('REVIEWED_APPROVAL_SHA256='+hashlib.sha256(output.read_bytes()).hexdigest())
          PY_RELEASE
          test "$(sha256sum "$RUNNER_TEMP/rc9-owner-release/approved-manifest.json" | cut -d' ' -f1)" = "$EXPECTED_APPROVED_SHA"
      - name: Sign approved bytes with exact GitHub owner Workflow OIDC and verify blob
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/rc9-owner-release"
          identity='https://github.com/aghajani82/u-opti/.github/workflows/smite-unified-trial-signed-pair-review.yml@refs/heads/trial/unified-smite-install'
          cosign sign-blob --yes --bundle "$dir/approved.sigstore.json" "$dir/approved-manifest.json" >/dev/null
          cosign verify-blob --bundle "$dir/approved.sigstore.json" \
            --trusted-root modules/smite-rc7-sigstore-trusted-root.json \
            --certificate-identity="$identity" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha="$GITHUB_SHA" \
            --certificate-github-workflow-repository=aghajani82/u-opti \
            --certificate-github-workflow-trigger=push \
            "$dir/approved-manifest.json" >/dev/null
          echo 'OWNER_RELEASE_BLOB_SIGNATURE=VERIFIED_NO_DEPLOYMENT'
          sha256sum "$dir/approved-manifest.json" "$dir/approved.sigstore.json"
      - uses: actions/upload-artifact@v4
        with:
          name: smite-rc9-signed-host-release-${{ github.sha }}
          path: ${{ runner.temp }}/rc9-owner-release/
          retention-days: 7
          if-no-files-found: error
