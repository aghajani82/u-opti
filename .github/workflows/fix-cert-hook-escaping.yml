name: Fix certificate renewal hook escaping

on:
  push:
    branches:
      - feature/3xui-multi-instance-cert-sync
    paths:
      - .github/workflows/fix-cert-hook-escaping.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3xui-multi-instance-cert-sync
      - name: Fix generated awk field escaping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/docker-3xui-certificate-multi.sh')
          lines = p.read_text().splitlines(keepends=True)
          changed = 0
          out = []
          for line in lines:
              stripped = line.lstrip()
              if stripped.startswith('CERT_FP="\\$(') or stripped.startswith('KEY_FP="\\$('):
                  new_line = line.replace("awk '{print $1}'", "awk '{print \\$1}'")
                  if new_line != line:
                      changed += 1
                  line = new_line
              out.append(line)
          if changed != 2:
              raise SystemExit(f'expected to fix 2 generated-hook lines, fixed {changed}')
          p.write_text(''.join(out))
          PY
          bash -n modules/docker-3xui-certificate-multi.sh
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/docker-3xui-certificate-multi.sh
          git commit -m "fix(cert): preserve awk fields in renewal hook"
          git push origin HEAD:feature/3xui-multi-instance-cert-sync
