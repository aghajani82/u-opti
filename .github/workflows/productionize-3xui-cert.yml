name: Productionize 3x-UI certificate sync

on:
  push:
    branches:
      - feature/3xui-multi-instance-cert-sync
    paths:
      - .github/workflows/productionize-3xui-cert.yml

permissions:
  contents: write

jobs:
  productionize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/3xui-multi-instance-cert-sync
          fetch-depth: 0

      - name: Apply production integration
        run: python3 scripts/productionize_3xui_cert.py

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n u-opti
          bash -n modules/docker-3xui-certificate-multi.sh

      - name: Commit production integration
        run: |
          set -euo pipefail
          # GitHub Apps cannot modify workflow files without workflows permission.
          # CI packaging checks remain in the existing workflow; discard only the
          # one-shot helper's attempted CI edit before committing product files.
          git checkout -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(cert): productionize multi-instance TLS certificate sync"
          git push origin HEAD:feature/3xui-multi-instance-cert-sync
